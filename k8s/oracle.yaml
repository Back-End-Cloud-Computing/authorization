# Banco do Authorization dentro do cluster.
#
# Uma replica so: o Deployment aqui serve para manter o Pod de pe e dar a ele um
# endereco estavel, nao para escalar. Bancos relacionais nao se replicam
# simplesmente aumentando "replicas" — precisariam de StatefulSet e de um
# esquema de replicacao proprio do Oracle.
#
# Os dados vivem no disco do Pod: se ele for recriado, o banco comeca vazio.
# Para o laboratorio isso basta, porque o schema e a conta ADMIN sao criados na
# subida da aplicacao.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-auth
  template:
    metadata:
      labels:
        app: oracle-auth
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          ports:
            - containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              value: oracle
            - name: APP_USER
              value: ganjj_auth
            - name: APP_USER_PASSWORD
              value: ganjj_auth
          # O Oracle demora bastante para aceitar conexao. Sem esta sonda, o
          # Service passaria a mandar trafego antes de o banco estar pronto.
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 30

---
# Endereco estavel do banco. E este nome, "oracle-auth", que a aplicacao usa em
# DB_HOST — nunca o IP do Pod, que muda a cada recriacao.
apiVersion: v1
kind: Service
metadata:
  name: oracle-auth
spec:
  selector:
    app: oracle-auth
  ports:
    - port: 1521
      targetPort: 1521
