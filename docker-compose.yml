# Sobe o Authorization Service junto do seu Oracle, os dois na rede ganjj-net.
#
# A rede e externa de proposito: os outros microsservicos do GANJJ (client,
# product, cart, order, promotion) entram nessa mesma rede e passam a enxergar
# este servico pelo nome "authorization".
#
#   docker network create ganjj-net     # uma vez, antes do primeiro up
#   ./scripts/generate-keys.sh          # gera o par de chaves RSA
#   docker compose up --build

services:
  oracle-auth:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-auth
    # Sem isto o serviço morre de vez num "docker compose restart" ou num
    # reboot: o depends_on/healthcheck só vale no "up", então a aplicação
    # sobe antes do banco aceitar conexão, falha e não tenta de novo.
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_ROOT_PASSWORD:-oracle}
      APP_USER: ${DB_USER:-ganjj_auth}
      APP_USER_PASSWORD: ${DB_PASSWORD:-ganjj_auth}
    ports:
      - "1521:1521"
    volumes:
      - oracle-auth-data:/opt/oracle/oradata
    healthcheck:
      # O servico so sobe depois que o banco aceita conexao — sem isso o Spring
      # tenta conectar antes do Oracle terminar de inicializar e morre.
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - ganjj-net

  authorization:
    build: .
    image: ganjj/authorization:1.0.0
    container_name: authorization
    restart: unless-stopped
    depends_on:
      oracle-auth:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_HOST: oracle-auth
      DB_PORT: 1521
      DB_NAME: FREEPDB1
      DB_USER: ${DB_USER:-ganjj_auth}
      DB_PASSWORD: ${DB_PASSWORD:-ganjj_auth}
      JPA_DDL_AUTO: update
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      JWT_ACCESS_TOKEN_MINUTES: 120
      JWT_REFRESH_TOKEN_DAYS: 7
      # Origens do frontend liberadas no CORS.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:3000}
      # Conta ADMIN inicial — o cadastro publico so cria contas CLIENTE.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ganjj.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminSegura123}
    ports:
      # Porta no host. Se algo local ja usa a 8081 (outro projeto, por
      # exemplo), suba com SERVER_HOST_PORT=8091. O container continua
      # na 8081 e os outros servicos seguem falando com "authorization:8081".
      - "${SERVER_HOST_PORT:-8081}:8081"
    volumes:
      # Somente leitura: o container nunca precisa escrever nas chaves.
      - ./keys:/keys:ro
    networks:
      - ganjj-net

volumes:
  oracle-auth-data:

networks:
  ganjj-net:
    external: true
