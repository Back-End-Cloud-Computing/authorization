spring.application.name=authorization

server.port=${SERVER_PORT:8081}

# --- Banco (Oracle) ---------------------------------------------------------
# Toda a configuracao vem de variavel de ambiente: a mesma imagem roda em
# desenvolvimento, teste e producao trocando apenas os valores.
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_NAME:FREEPDB1}
spring.datasource.username=${DB_USER:ganjj_auth}
spring.datasource.password=${DB_PASSWORD:ganjj_auth}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# --- JWT --------------------------------------------------------------------
# Sem os caminhos das chaves o servico gera um par RSA temporario e avisa no
# log. Em qualquer ambiente compartilhado, aponte para as chaves reais
# (scripts/generate-keys.sh gera o par).
jwt.issuer=${JWT_ISSUER:ganjj-authorization}
jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
# Faxina diaria dos refresh tokens revogados que ja expiraram sozinhos.
jwt.revoked-cleanup-cron=${JWT_REVOKED_CLEANUP_CRON:0 0 3 * * *}

# --- CORS -------------------------------------------------------------------
# Origens do frontend, separadas por virgula. O padrao cobre as portas usuais
# de desenvolvimento (Angular, Vite, React).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

# --- Conta ADMIN inicial ----------------------------------------------------
# O cadastro publico so cria contas CLIENTE. Preencha estas duas variaveis para
# que a primeira conta ADMIN seja criada na inicializacao (idempotente).
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# --- Documentacao -----------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
