# Nos testes o Oracle e substituido por H2 em memoria: o codigo nao muda,
# so a configuracao — que e exatamente o ponto de externalizar tudo em
# variavel de ambiente.
spring.datasource.url=jdbc:h2:mem:authtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.issuer=ganjj-authorization-test
jwt.access-token-minutes=15
jwt.refresh-token-days=7
jwt.private-key-path=
jwt.public-key-path=
jwt.revoked-cleanup-cron=0 0 3 * * *

cors.allowed-origins=http://localhost:4200

# Conta ADMIN usada pelos testes de autorizacao por papel.
admin.email=admin@ganjj.com
admin.password=adminSegura123
